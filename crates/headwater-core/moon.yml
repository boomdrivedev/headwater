$schema: 'https://moonrepo.dev/schemas/project.json'

# The core: identities, the version order and level, the dependency
# descriptions, the tiers declaration, the seams and the derivation.
language: 'rust'

# Each check is one task in the fast layer, run from the workspace root by
# the toolchain .prototools pins: the crate's layout by rustfmt, its lint by
# clippy at -D warnings, its types by cargo check over every target, and its
# tests. No task reads a Markdown file (record 0001).
tasks:
  format:
    command: 'cargo fmt -p headwater-core --check'
    inputs: ['/crates/headwater-core/**/*', '/Cargo.toml', '/rust-toolchain.toml', '/.prototools']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy -p headwater-core --all-targets -- -D warnings'
    inputs: ['/crates/headwater-core/**/*', '/Cargo.toml', '/Cargo.lock', '/rust-toolchain.toml', '/.prototools', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  typecheck:
    command: 'cargo check -p headwater-core --all-targets'
    inputs: ['/crates/headwater-core/**/*', '/Cargo.toml', '/Cargo.lock', '/rust-toolchain.toml', '/.prototools', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  test:
    command: 'cargo test -p headwater-core'
    inputs: ['/crates/headwater-core/**/*', '/Cargo.toml', '/Cargo.lock', '/rust-toolchain.toml', '/.prototools', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
