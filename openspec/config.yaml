schema: spec-driven

context: |
  headwater reports every release newer than what a repository pins, with
  upstream's notes and the advisories that name it. It never changes the
  repository and never acts on a release. It is written in Rust, with a
  site in Astro.
  The design is the statement of invariants in boomdrivedev/blueprints,
  design/headwater/requirements.md (local:
  ~/Code/boomdrive/boomdrivedev/blueprints/design/headwater/requirements.md),
  with its model, design/headwater/models/; the design book is
  https://boomdrivedev.github.io/blueprints/headwater/. An artifact that
  rests on a clause cites it by bare number, (70), a profile's section by
  its letter, (C.2), and a scenario by its name, (S16), and never restates
  it. A clause of another tool's statement names the tool: (millpond C.12),
  (timber 31).

  Until headwater's rules are written into docs/architecture/ (plan step
  H2), boomdrivedev/blueprints design/principles.md binds; decisions are
  docs/adr/ (MADR, numbered, adrs.toml). A clause that no longer holds is
  changed in the statement first, never worked around here.

  The words are the statement's vocabulary (its section 3): specs, design
  and code use its terms as it defines them and redefine none.

  Every cargo and moon command runs inside devenv shell. Commit by
  pathspec only: git add <paths>; git commit -m "<subject>" -- <paths>.
  Conventional Commits, scope the part of the tree touched. main is
  protected: work on a worktree branch and land with sluice submit main.

rules:
  proposal:
    - State what is out of scope and which later change it waits on
  specs:
    - Requirements use the statement's words; a scenario is checkable by a crate's tests against recorded lookups
  tasks:
    - Every task names its verification; site pages and ADRs land with the group that changes the behaviour they describe
    - A change that adds a language, a file type, a crate, a plugin directory or a directory under site/ has a task that puts it under treefmt, its linter and a check-fast moon task; a verification is a moon task the gate runs, or the task says why it can only be run by hand
